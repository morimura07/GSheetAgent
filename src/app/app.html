<!doctype html>
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #1f2328;
        --muted: #5f6368;
        --line: #d0d7de;
        --primary: #1a73e8;
        --on: #188038;
        --error: #c5221f;
        --error-bg: #fce8e6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121417;
          --card: #1e2125;
          --text: #e8eaed;
          --muted: #9aa0a6;
          --line: #3c4043;
          --primary: #8ab4f8;
          --on: #81c995;
          --error: #f28b82;
          --error-bg: #3c1f1e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-text-size-adjust: 100%;
      }
      .page {
        max-width: 560px;
        margin: 0 auto;
        padding: 12px 16px 48px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0 12px;
      }
      h1 {
        font-size: 22px;
        margin: 0;
      }
      h2 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin: 12px 0;
      }
      .hidden {
        display: none !important;
      }
      .status {
        margin: 0 0 10px;
        color: var(--muted);
      }
      .status.on {
        color: var(--on);
        font-weight: 600;
      }
      .status.error {
        color: var(--error);
      }
      .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .tile {
        min-height: 72px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--primary);
        font-weight: 600;
        font-size: 15px;
      }
      .fields {
        display: grid;
        gap: 10px;
      }
      .field {
        display: grid;
        gap: 4px;
      }
      .field > span {
        font-size: 14px;
        color: var(--muted);
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        padding: 8px 10px;
        font: inherit; /* 16px stops iOS zooming */
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      input[type='file'] {
        min-height: 0;
        padding: 8px 0;
        border: 0;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 14px 0 4px;
      }
      .check input {
        width: 22px;
        min-height: 22px;
      }
      .err {
        color: var(--error);
        min-height: 0;
      }
      .err:empty {
        display: none;
      }
      .invalid input,
      .invalid select,
      .invalid textarea {
        border-color: var(--error);
        background: var(--error-bg);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .primary {
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        padding: 0 16px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        margin-top: 12px;
      }
      @media (prefers-color-scheme: dark) {
        .primary {
          color: #0b1a33;
        }
      }
      .primary:disabled {
        opacity: 0.6;
      }
      .wide {
        width: 100%;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .row .primary {
        margin-top: 0;
      }
      .back,
      .link {
        background: none;
        border: 0;
        color: var(--primary);
        padding: 8px 0;
        min-height: 44px;
      }
      .link {
        margin-top: 4px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .preview {
        max-width: 100%;
        max-height: 240px;
        border-radius: 8px;
        margin-top: 8px;
      }
      .toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
        max-width: 528px;
        margin: 0 auto;
        padding: 12px 14px;
        border-radius: 10px;
        background: #202124;
        color: #fff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      }
      .toast.error {
        background: var(--error);
      }
      .loading {
        padding: 40px 16px;
        text-align: center;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="app"><p class="loading">Loading…</p></div>
    <!-- CLIENT_SCRIPT -->
  </body>
</html>
